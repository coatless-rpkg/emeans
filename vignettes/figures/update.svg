<svg xmlns="http://www.w3.org/2000/svg" class="em-fig" viewBox="0 0 760 330" width="100%" style="max-width:760px;height:auto" role="img" aria-labelledby="em-update-title em-update-desc"><title id="em-update-title">One batch update</title><desc id="em-update-desc">A centroid moves a fraction w of the way toward the mean of the batch points assigned to it.</desc><style>.em-fig{--em-ink:#1E1838;--em-muted:#5E5880;--em-grid:#E3DFF0;--em-panel:#F7F5FD;--em-mint:#0F8F72;--em-peri:#4C5AD6;--em-amber:#B86E00;font-family:inherit;color:var(--em-ink)}[data-bs-theme="dark"] .em-fig{--em-ink:#ECEAF8;--em-muted:#A9A3C9;--em-grid:#2E2850;--em-panel:#201A3C;--em-mint:#22A888;--em-peri:#6E7DEB;--em-amber:#C98018;}.em-fig text{fill:var(--em-ink);font-size:15px}.em-fig .muted{fill:var(--em-muted)}.em-fig .small{font-size:13px}.em-fig .code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px}.em-fig .strong{font-weight:600}</style><circle cx="352.5" cy="186.9" r="7" fill="var(--em-mint)" fill-opacity="0.85"/><circle cx="315.6" cy="167.4" r="7" fill="var(--em-mint)" fill-opacity="0.85"/><circle cx="352.4" cy="139.4" r="7" fill="var(--em-mint)" fill-opacity="0.85"/><circle cx="431.2" cy="177.0" r="7" fill="var(--em-mint)" fill-opacity="0.85"/><circle cx="351.9" cy="170.4" r="7" fill="var(--em-mint)" fill-opacity="0.85"/><circle cx="403.3" cy="162.4" r="7" fill="var(--em-mint)" fill-opacity="0.85"/><circle cx="391.1" cy="129.0" r="7" fill="var(--em-mint)" fill-opacity="0.85"/><circle cx="349.9" cy="133.1" r="7" fill="var(--em-mint)" fill-opacity="0.85"/><circle cx="322.5" cy="91.0" r="7" fill="var(--em-mint)" fill-opacity="0.85"/><circle cx="299.9" cy="123.9" r="7" fill="var(--em-mint)" fill-opacity="0.85"/><circle cx="356.3" cy="138.8" r="7" fill="var(--em-mint)" fill-opacity="0.85"/><circle cx="374.5" cy="112.5" r="7" fill="var(--em-mint)" fill-opacity="0.85"/><circle cx="354.9" cy="155.9" r="7" fill="var(--em-mint)" fill-opacity="0.85"/><circle cx="396.2" cy="134.6" r="7" fill="var(--em-mint)" fill-opacity="0.85"/><line x1="95.2" y1="235.1" x2="360" y2="150" stroke="var(--em-muted)" stroke-width="2" stroke-dasharray="4 6"/><path d="M95.2,235.1L170.0,211.1" fill="none" stroke="var(--em-amber)" stroke-width="4" stroke-linecap="round"/><path d="M182.4,207.1L167.8,204.3L172.2,217.9z" fill="var(--em-amber)"/><circle cx="80" cy="240" r="12" fill="none" stroke="var(--em-ink)" stroke-width="3"/><path d="M360,137l13,13l-13,13l-13,-13z" fill="var(--em-ink)" stroke="var(--em-panel)" stroke-width="2"/><circle cx="197.6" cy="202.2" r="12" fill="var(--em-amber)"/><text x="68" y="280">centroid before</text><text x="207.6" y="242.2">centroid after</text><text x="330" y="258">batch mean</text><text x="330" y="276" class="muted small">of the points assigned to it</text><line x1="360" y1="238" x2="360" y2="168" stroke="var(--em-muted)" stroke-width="1.5"/><rect x="510" y="36" width="226" height="258" rx="14" fill="var(--em-panel)"/><text x="530" y="70" class="strong">Each batch</text><text x="530" y="102" class="code">N ← (1 − α) N + α n</text><text x="530" y="124" class="muted small">running count of the cluster</text><text x="530" y="164" class="code">c ← c + w (m − c)</text><text x="530" y="186" class="muted small">move toward the batch mean m</text><text x="530" y="226" class="code">w = α n / N</text><text x="530" y="248" class="muted small">n points in this batch;</text><text x="530" y="266" class="muted small">α shrinks over training</text></svg>
