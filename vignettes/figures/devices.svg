<svg xmlns="http://www.w3.org/2000/svg" class="em-fig" viewBox="0 0 760 300" width="100%" style="max-width:760px;height:auto" role="img" aria-labelledby="em-devices-title em-devices-desc"><title id="em-devices-title">Where the work happens</title><desc id="em-devices-desc">On the CPU, a C++ kernel assigns points and sums them in double precision. With torch, assignment, sums and updates stay on the device in float32, and only small totals come back to R.</desc><style>.em-fig{--em-ink:#1E1838;--em-muted:#5E5880;--em-grid:#E3DFF0;--em-panel:#F7F5FD;--em-mint:#0F8F72;--em-peri:#4C5AD6;--em-amber:#B86E00;font-family:inherit;color:var(--em-ink)}[data-bs-theme="dark"] .em-fig{--em-ink:#ECEAF8;--em-muted:#A9A3C9;--em-grid:#2E2850;--em-panel:#201A3C;--em-mint:#22A888;--em-peri:#6E7DEB;--em-amber:#C98018;}.em-fig text{fill:var(--em-ink);font-size:15px}.em-fig .muted{fill:var(--em-muted)}.em-fig .small{font-size:13px}.em-fig .code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px}.em-fig .strong{font-weight:600}</style><text x="20" y="68" class="strong">CPU</text><rect x="150" y="30" width="180" height="64" rx="12" fill="var(--em-panel)" stroke="var(--em-peri)" stroke-width="2"/><text x="240.0" y="61.0" text-anchor="middle" class="code">R matrix</text><text x="240.0" y="80.0" text-anchor="middle" class="muted small">double</text><path d="M330.0,62.0L345.0,62.0" fill="none" stroke="var(--em-ink)" stroke-width="2" stroke-linecap="round"/><path d="M354.0,62.0L345.0,57.0L345.0,67.0z" fill="var(--em-ink)"/><rect x="356" y="30" width="180" height="64" rx="12" fill="var(--em-panel)" stroke="var(--em-peri)" stroke-width="2"/><text x="446.0" y="61.0" text-anchor="middle" class="code">C++ kernel</text><text x="446.0" y="80.0" text-anchor="middle" class="muted small">direct or BLAS</text><path d="M536.0,62.0L551.0,62.0" fill="none" stroke="var(--em-ink)" stroke-width="2" stroke-linecap="round"/><path d="M560.0,62.0L551.0,57.0L551.0,67.0z" fill="var(--em-ink)"/><rect x="562" y="30" width="180" height="64" rx="12" fill="var(--em-panel)" stroke="var(--em-peri)" stroke-width="2"/><text x="652.0" y="61.0" text-anchor="middle" class="code">update in R</text><text x="652.0" y="80.0" text-anchor="middle" class="muted small">k × d</text><text x="20" y="188" class="strong">GPU</text><rect x="150" y="150" width="180" height="64" rx="12" fill="var(--em-panel)" stroke="var(--em-mint)" stroke-width="2"/><text x="240.0" y="181.0" text-anchor="middle" class="code">torch tensor</text><text x="240.0" y="200.0" text-anchor="middle" class="muted small">float32, on device</text><path d="M330.0,182.0L345.0,182.0" fill="none" stroke="var(--em-ink)" stroke-width="2" stroke-linecap="round"/><path d="M354.0,182.0L345.0,177.1L345.0,186.9z" fill="var(--em-ink)"/><rect x="356" y="150" width="180" height="64" rx="12" fill="var(--em-panel)" stroke="var(--em-mint)" stroke-width="2"/><text x="446.0" y="181.0" text-anchor="middle" class="code">addmm + min</text><text x="446.0" y="200.0" text-anchor="middle" class="muted small">index_add_</text><path d="M536.0,182.0L551.0,182.0" fill="none" stroke="var(--em-ink)" stroke-width="2" stroke-linecap="round"/><path d="M560.0,182.0L551.0,177.1L551.0,186.9z" fill="var(--em-ink)"/><rect x="562" y="150" width="180" height="64" rx="12" fill="var(--em-panel)" stroke="var(--em-mint)" stroke-width="2"/><text x="652.0" y="181.0" text-anchor="middle" class="code">update on device</text><text x="652.0" y="200.0" text-anchor="middle" class="muted small">k × d</text><text x="150" y="262" class="muted small">Back to R from the GPU: cluster counts at revival checks and the totals at the end of each pass.</text></svg>
