<svg xmlns="http://www.w3.org/2000/svg" class="em-fig" viewBox="0 0 760 300" width="100%" style="max-width:760px;height:auto" role="img" aria-labelledby="em-loop-title em-loop-desc"><title id="em-loop-title">Training one batch at a time</title><desc id="em-loop-desc">Call em_begin once. For each pass, call em_accumulate and em_update for every batch, then em_end_epoch. After the last pass, call em_finalize.</desc><style>.em-fig{--em-ink:#1E1838;--em-muted:#5E5880;--em-grid:#E3DFF0;--em-panel:#F7F5FD;--em-mint:#0F8F72;--em-peri:#4C5AD6;--em-amber:#B86E00;font-family:inherit;color:var(--em-ink)}[data-bs-theme="dark"] .em-fig{--em-ink:#ECEAF8;--em-muted:#A9A3C9;--em-grid:#2E2850;--em-panel:#201A3C;--em-mint:#22A888;--em-peri:#6E7DEB;--em-amber:#C98018;}.em-fig text{fill:var(--em-ink);font-size:15px}.em-fig .muted{fill:var(--em-muted)}.em-fig .small{font-size:13px}.em-fig .code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px}.em-fig .strong{font-weight:600}</style><rect x="16" y="92" width="140" height="64" rx="12" fill="var(--em-panel)" stroke="var(--em-peri)" stroke-width="2"/><text x="86.0" y="123.0" text-anchor="middle" class="code">em_begin()</text><text x="86.0" y="142.0" text-anchor="middle" class="muted small">once</text><rect x="190" y="26" width="400" height="254" rx="18" fill="none" stroke="var(--em-grid)" stroke-width="2" stroke-dasharray="6 6"/><text x="206" y="268" class="muted small">each pass: recipe$epoch_rows[i] rows</text><rect x="210" y="92" width="168" height="64" rx="12" fill="var(--em-panel)" stroke="var(--em-mint)" stroke-width="2"/><text x="294.0" y="123.0" text-anchor="middle" class="code">em_accumulate()</text><text x="294.0" y="142.0" text-anchor="middle" class="muted small">a batch, or pieces</text><rect x="404" y="92" width="168" height="64" rx="12" fill="var(--em-panel)" stroke="var(--em-mint)" stroke-width="2"/><text x="488.0" y="123.0" text-anchor="middle" class="code">em_update()</text><text x="488.0" y="142.0" text-anchor="middle" class="muted small">apply the batch</text><rect x="306" y="186" width="168" height="48" rx="12" fill="var(--em-panel)" stroke="var(--em-peri)" stroke-width="2"/><text x="390.0" y="215.0" text-anchor="middle" class="code">em_end_epoch()</text><rect x="616" y="92" width="128" height="64" rx="12" fill="var(--em-panel)" stroke="var(--em-peri)" stroke-width="2"/><text x="680.0" y="123.0" text-anchor="middle" class="code">em_finalize()</text><text x="680.0" y="142.0" text-anchor="middle" class="muted small">exact means</text><path d="M156.0,124.0L197.0,124.0" fill="none" stroke="var(--em-ink)" stroke-width="2" stroke-linecap="round"/><path d="M206.0,124.0L197.0,119.0L197.0,128.9z" fill="var(--em-ink)"/><path d="M378.0,124.0L391.0,124.0" fill="none" stroke="var(--em-ink)" stroke-width="2" stroke-linecap="round"/><path d="M400.0,124.0L391.0,119.0L391.0,128.9z" fill="var(--em-ink)"/><path d="M488,90 C488,50 294.0,41.0 294.0,81.0" fill="none" stroke="var(--em-ink)" stroke-width="2" stroke-linecap="round"/><path d="M294,90L289.1,81.0L298.9,81.0z" fill="var(--em-ink)"/><text x="391" y="44" text-anchor="middle" class="muted small">next batch</text><path d="M452.0,158.0L432.4,177.6" fill="none" stroke="var(--em-ink)" stroke-width="2" stroke-linecap="round"/><path d="M426.0,184.0L435.9,181.1L428.9,174.1z" fill="var(--em-ink)"/><path d="M304,210 C258,210 250.0,213.0 250.0,167.0" fill="none" stroke="var(--em-ink)" stroke-width="2" stroke-linecap="round"/><path d="M250,158L254.9,167.0L245.1,167.0z" fill="var(--em-ink)"/><text x="204" y="198" class="muted small">next</text><text x="204" y="214" class="muted small">pass</text><path d="M476,210 C650,210 680.0,213.0 680.0,167.0" fill="none" stroke="var(--em-ink)" stroke-width="2" stroke-linecap="round"/><path d="M680,158L685.0,167.0L675.0,167.0z" fill="var(--em-ink)"/><text x="596" y="236" class="muted small">after the last pass</text></svg>
